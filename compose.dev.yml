name: sqldash-development

services:
  dashboard:
    image: sqldash:development
    build:
      context: .
    container_name: sqldash-development
    env_file:
      - .env
    environment:
      SQLDASH_DATA_DIRECTORY: /data
      SQLDASH_DOMAIN: localhost
      SQLDASH_PUBLIC_URL: http://localhost:8888
      SQLDASH_HTTP_PORT: "80"
      SQLDASH_HTTPS_PORT: "443"
      SQLDASH_REDIRECT_TO_TLS: "false"
      SQLDASH_WEB_ADDRESS: 0.0.0.0:7070
      SQLDASH_SQLD_MANAGED: "false"
      SQLDASH_REDIS_ALLOW_PLAINTEXT: "true"
      SQLDASH_SQLD_ADDRESS: libsql-local:8080
      SQLDASH_SQLD_ADMIN_ADDRESS: libsql-local:8081
      SQLDASH_POSTGRES_ENABLED: "true"
      SQLDASH_POSTGRES_MANAGED: "true"
      SQLDASH_POSTGRES_GATEWAY_ENABLED: "true"
      SQLDASH_POSTGRES_GATEWAY_ADDRESS: :5432
      SQLDASH_POSTGRES_PUBLIC_HOST: localhost
      SQLDASH_POSTGRES_PUBLIC_PORT: "5432"
    ports:
      - "127.0.0.1:8888:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:7070:7070"
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6379:6379"
    depends_on:
      libsql:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - state:/data
      - ./templates:/sqldash/templates:ro
      - ./static:/sqldash/static:ro
    stop_grace_period: 70s

  libsql:
    image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
    container_name: libsql-local
    command: ["/bin/sqld", "--enable-namespaces"]
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_ADMIN_LISTEN_ADDR: 0.0.0.0:8081
    volumes:
      - libsql-state:/var/lib/sqld
    stop_grace_period: 70s

volumes:
  state:
    name: sqldash-development
  libsql-state:
    external: true
    name: ${SQLDASH_DEVELOPMENT_LIBSQL_VOLUME:?Set the existing libSQL volume name}
